# Image mode's labeling config, the tuning grid's winner: SAM 3 end to end on the 10 raw names,
# untiled, fp16 -> box filter (NMS 0.5) -> SAM 2.1 S (fp32). The stored auto-labels are cut at
# the confidence floor, the winner's max-F1 confidence on train-sample.
trials:
  - name: sam3-sam2.1-s
    detector:
      model: facebook/sam3
      prompts:
        pedestrian: person
        people: person
        bicycle: two-three-wheeler
        car: vehicle
        van: vehicle
        truck: vehicle
        tricycle: two-three-wheeler
        awning-tricycle: two-three-wheeler
        bus: vehicle
        motor: two-three-wheeler
      dtype: float16
    box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
    segmenter: facebook/sam2.1-hiera-small
    confidence_floor: 0.597
