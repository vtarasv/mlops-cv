# The confidence floor on BoT-SORT, on the clips. The floor sets track_high_thresh =
# new_track_thresh. 0.597 is the winner so far (tracker-model-botsort, same config); every floor
# shares one pass of the stored detector boxes and the box filter.
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
  tracker: {model: botsort}
trials:
  - name: botsort-0.497
    confidence_floor: 0.497
  - name: botsort-0.597
    confidence_floor: 0.597
  - name: botsort-0.697
    confidence_floor: 0.697
