# Experiment 3, extended: SAM 2.1 S video and SAM 3's box-prompted video tracker at K=5 on the
# val clips, under video-trackers.yaml's setup (GDINO-B's stored val-clip pass, Experiment 2's box
# filter, the floor gating seeds, each mask leaving as its tight box). Its TrackTrack and EdgeTAM
# rows stand, so only the two new trials run here. Each is capped at the most live tracks that fit
# 8 GB on the densest clip (uav0000137_00458_v, 178 uncapped): SAM 2.1 S 128, SAM 3 96.
defaults:
  detector:
    model: IDEA-Research/grounding-dino-base
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: null}
  confidence_floor: 0.218
trials:
  - name: sam2.1-s-k5
    tracker: {model: facebook/sam2.1-hiera-small, key_interval: 5, max_objects: 128}
  - name: sam3-tracker-k5
    tracker: {model: facebook/sam3, key_interval: 5, max_objects: 96}
