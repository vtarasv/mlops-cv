# EdgeTAM at K = 1 on the clips, every frame seeded, beside the key-interval stage's K = 5, 10
# and 20. Everything else is that stage's.
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
  confidence_floor: 0.597
trials:
  - name: edgetam-k1
    tracker: {model: yonigozlan/EdgeTAM-hf, key_interval: 1}
