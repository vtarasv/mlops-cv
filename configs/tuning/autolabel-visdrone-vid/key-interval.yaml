# The labeler on every K-th frame of the clips, tracked by EdgeTAM at K in {5, 10, 20} (winner so
# far: 10). A kept box below the floor starts or refreshes no track. Every trial reads the clips'
# stored detector pass when a box-tracker trial has written one.
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
  confidence_floor: 0.597
trials:
  - name: edgetam-k10
    tracker: {model: yonigozlan/EdgeTAM-hf, key_interval: 10}
  - name: edgetam-k5
    tracker: {model: yonigozlan/EdgeTAM-hf, key_interval: 5}
  - name: edgetam-k20
    tracker: {model: yonigozlan/EdgeTAM-hf, key_interval: 20}
