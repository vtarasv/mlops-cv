# Fixed, held-out VisDrone-VID test-dev clips for qualitative GT-vs-prediction demo videos
# (the same clips every run, so experiments stay visually comparable).
split: test
fps: 30   # playback speed only: VisDrone-VID stores frames indexed by number, with no source video
max_side: 1920   # downscale cap
clips:
  - uav0000161_00000_v   # 960x540   two-three-wheeler-rich mixed street
  - uav0000355_00001_v   # 1360x765  vehicle-dominant road
  - uav0000073_00600_v   # 1920x1080 dense pedestrian crowd
