# The labeler's labeling config, AutolabelSettings' defaults: SAM 3 end to end on the 10 raw
# names, untiled, fp16 -> box filter (NMS 0.5). The confidence floor (0.597) cuts the kept
# auto-labels, not the scored ones.
trials:
  - name: sam3
    detector:
      model: facebook/sam3
      prompts:
        pedestrian: person
        people: person
        bicycle: two-three-wheeler
        car: vehicle
        van: vehicle
        truck: vehicle
        tricycle: two-three-wheeler
        awning-tricycle: two-three-wheeler
        bus: vehicle
        motor: two-three-wheeler
      dtype: float16
    box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
    confidence_floor: 0.597
