# Image-mode stage 1: the box filter on Grounding DINO-T with the 10 raw names, boxes only.
# The detector keeps its top 300 boxes above 0.001 and the filter has no score floor: the
# validator's max-F1 point selects. NMS IoU {off, 0.5, 0.6, 0.7} x the nested-box rule {off,
# keep outer, keep inner at IoS 0.8}. The detector runs once; every trial rescores its stored
# boxes. The incumbent is nms0.6-outer.
defaults:
  detector:
    model: IDEA-Research/grounding-dino-tiny
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
  box_filter: {min_side: 8, max_area: 0.05}
trials:
  - name: nms-off-nested-off
  - name: nms-off-outer
    box_filter: {nested_ios: 0.8}
  - name: nms-off-inner
    box_filter: {nested_ios: 0.8, nested_keep: inner}
  - name: nms0.5-nested-off
    box_filter: {nms_iou: 0.5}
  - name: nms0.5-outer
    box_filter: {nms_iou: 0.5, nested_ios: 0.8}
  - name: nms0.5-inner
    box_filter: {nms_iou: 0.5, nested_ios: 0.8, nested_keep: inner}
  - name: nms0.6-nested-off
    box_filter: {nms_iou: 0.6}
  - name: nms0.6-outer
    box_filter: {nms_iou: 0.6, nested_ios: 0.8}
  - name: nms0.6-inner
    box_filter: {nms_iou: 0.6, nested_ios: 0.8, nested_keep: inner}
  - name: nms0.7-nested-off
    box_filter: {nms_iou: 0.7}
  - name: nms0.7-outer
    box_filter: {nms_iou: 0.7, nested_ios: 0.8}
  - name: nms0.7-inner
    box_filter: {nms_iou: 0.7, nested_ios: 0.8, nested_keep: inner}
