# The sequence-mode smoke: the image-mode smoke chain (Grounding DINO-T on the 10 raw names -> the
# box filter, untiled) on key frames, tracked by EdgeTAM video at K = 10 with the key-frame rules'
# defaults. The BoT-SORT and ByteTrack controls share one detection pass with SAM 2.1 S masks on
# every frame. Tracking needs whole sequences: run it on val-full.
defaults:
  detector:
    model: IDEA-Research/grounding-dino-tiny
    threshold: 0.25  # the smoke's floor; the harness default is now 0.001
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
  box_filter: {min_side: 8, max_area: 0.05, min_score: 0.4, nms_iou: 0.6, nested_ios: 0.8, max_objects: 300}
trials:
  - name: edgetam-k10
    tracker: {model: yonigozlan/EdgeTAM-hf, key_interval: 10}
  - name: botsort
    segmenter: facebook/sam2.1-hiera-small
    tracker: {model: botsort}
  - name: bytetrack
    segmenter: facebook/sam2.1-hiera-small
    tracker: {model: bytetrack}
