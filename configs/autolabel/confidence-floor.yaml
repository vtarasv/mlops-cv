# Sequence-mode stage 3 on val-full: the confidence floor on stage 2's winner, BoT-SORT + SAM 2.1 S.
# The floor sets track_high_thresh = new_track_thresh and cuts the stored auto-labels. 0.597 is the
# incumbent (stage 2's tracker-model-botsort run, same config); every floor shares one pass of the
# stored detector boxes, the box filter and SAM 2.1 S.
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
  segmenter: facebook/sam2.1-hiera-small
  tracker: {model: botsort}
trials:
  - name: botsort-0.497
    confidence_floor: 0.497
  - name: botsort-0.597
    confidence_floor: 0.597
  - name: botsort-0.697
    confidence_floor: 0.697
