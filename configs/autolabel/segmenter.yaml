# Image-mode stage 6: the segmenter on stage 5's winner, SAM 3 end to end on the 10 raw names,
# untiled, fp16, NMS 0.5 (boxes from its store, except own masks, which rerun the detector).
# SAM 2.1 S (the incumbent) and L, SAM 3's tracker prompted with the kept boxes
# (segmenters in fp32), and SAM 3's own masks. The stored auto-labels are cut at the carried
# confidence floor.
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
  confidence_floor: 0.597
trials:
  - name: sam2.1-s
    segmenter: facebook/sam2.1-hiera-small
  - name: sam2.1-l
    segmenter: facebook/sam2.1-hiera-large
  - name: sam3-tracker
    segmenter: facebook/sam3
  - name: sam3-own
    segmenter: own
