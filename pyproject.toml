[project]
name = "mlops-cv"
version = "0.1.0"
description = "MLOps level-2 pipeline for aerial object detection from video"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "pytest>=9.1.1",
    "pyright==1.1.411",
    "httpx2==2.12.0",
]

training = [
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "mlflow==3.14.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "ultralytics==8.4.72",
]

airflow = [
    "apache-airflow==3.2.2",
    "apache-airflow-providers-docker==4.5.7",
]

beam = [
    "apache-beam==2.75.0",
    "betterproto==2.0.0b6",
    "imagehash==4.3.2",
    "mlflow-skinny==3.14.0",
]

streaming = [
    "confluent-kafka==2.15.0",
]

monitoring = [
    "confluent-kafka==2.15.0",
    "mlflow-skinny==3.14.0",
    "prometheus-client==0.26.0",
]

serving = [
    "opencv-python-headless==4.13.0.92",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
    "prometheus-fastapi-instrumentator==8.1.0",
    "mlflow-skinny==3.14.0",
    "onnxruntime-gpu==1.27.0; sys_platform == 'linux'",
    # The CUDA EP's libs; ORT's [cuda] extra names the empty *-cu13 placeholders. Torch's pins.
    "nvidia-cublas==13.1.1.3; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-runtime==13.0.96; sys_platform == 'linux'",
    "nvidia-cudnn-cu13==9.20.0.48; sys_platform == 'linux'",
    "nvidia-cufft==12.0.0.61; sys_platform == 'linux'",
    "nvidia-curand==10.4.0.35; sys_platform == 'linux'",
]

optimize = [
    "nvidia-ml-py==13.610.43",
    "ncnn==1.0.20260526",
    "pnnx==20260526",
    "onnx==1.22.0",
    "onnxruntime-gpu==1.27.0; sys_platform == 'linux'",
    "onnxslim==0.1.94",
    "tensorrt-cu13==10.16.1.11; sys_platform == 'linux'",
]

edge = [
    "ncnn==1.0.20260526",
    "opencv-python==4.13.0.92",
    "mlflow-skinny==3.14.0",
]

[tool.uv]
default-groups = [
    "dev",
    "training",
    "airflow",
    "beam",
    "streaming",
    "monitoring",
    "optimize",
    "serving",
    "edge",
]

required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_cv"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle(E,W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B), simplify(SIM)
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU (skipped in CI)",
    "docker: requires Docker services (skipped in CI)",
]

# Lets a Mac lock: tensorrt-cu13-libs can't be built off Linux.
# On a TensorRT bump, update this entry (test_dependency_metadata.py checks the version).
[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-libs"
version = "10.16.1.11"
requires-dist = []
