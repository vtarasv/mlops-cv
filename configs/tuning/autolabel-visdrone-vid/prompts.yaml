# Prompts, through the box-filter stage's winner. SAM 3 end to end in fp32 with the 10 raw names
# (the winner so far; its stored boxes rescore on CPU) against the 3 merged-class names, each its
# own prompt. The detector keeps its top 300 boxes above 0.001.
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: null
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
trials:
  - name: sam3-raw
  - name: sam3-merged
    detector:
      prompts: {person: person, vehicle: vehicle, two-three-wheeler: two-three-wheeler}
