# The tracker model on the clips, video trackers at K = 5. EdgeTAM is the winner so far
# (key-interval-edgetam-k5, same config); SAM 2.1 S video is its sibling. BoT-SORT and ByteTrack
# share one pass of the stored detector boxes and the box filter on every frame, the floor as
# their track thresholds.
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
  confidence_floor: 0.597
trials:
  - name: botsort
    tracker: {model: botsort}
  - name: bytetrack
    tracker: {model: bytetrack}
  - name: edgetam-k5
    tracker: {model: yonigozlan/EdgeTAM-hf, key_interval: 5}
  - name: sam2.1-s-k5
    tracker: {model: facebook/sam2.1-hiera-small, key_interval: 5}
