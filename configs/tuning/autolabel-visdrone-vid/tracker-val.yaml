# Experiment 2, stage 3: the val check. The winner, TrackTrack at its defaults (stage 2 changed
# none), and the runner-up, BoT-SORT, on the val clips, with stage 1's detector, box filter and
# floor (0.218 as track_high_thresh = new_track_thresh). The first trial stores the val-clip pass.
defaults:
  detector:
    model: IDEA-Research/grounding-dino-base
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: null}
  confidence_floor: 0.218
trials:
  - name: tracktrack
    tracker: {model: tracktrack}
  - name: botsort
    tracker: {model: botsort}
