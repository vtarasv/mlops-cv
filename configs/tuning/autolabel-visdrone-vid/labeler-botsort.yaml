# The labeler on every frame of the clips, tracked by BoT-SORT: the winner so far. The confidence
# floor (0.597) sets track_high_thresh = new_track_thresh.
trials:
  - name: botsort-sam2.1-s
    detector:
      model: facebook/sam3
      prompts:
        pedestrian: person
        people: person
        bicycle: two-three-wheeler
        car: vehicle
        van: vehicle
        truck: vehicle
        tricycle: two-three-wheeler
        awning-tricycle: two-three-wheeler
        bus: vehicle
        motor: two-three-wheeler
      dtype: float16
    box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
    tracker: {model: botsort}
    confidence_floor: 0.597
