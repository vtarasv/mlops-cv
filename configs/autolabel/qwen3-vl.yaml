# Image mode's reference row (reported only, never selects): Qwen3-VL-4B-Instruct in 8-bit on the
# 10 raw names, boxes only, through the box filter, run with `--every 5` (2 frames a sequence).
# It has no scores: every box gets conf 1.0, so there is no confidence floor. SAM 3 fp16 and
# GDINO-T rescore their stored boxes (CPU) on the same frames beside it.
defaults:
  detector:
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
trials:
  - name: sam3-fp16-raw
    detector: {model: facebook/sam3, dtype: float16}
  - name: gdino-t-raw
    detector: {model: IDEA-Research/grounding-dino-tiny}
  - name: 4b-int8-raw
    detector: {model: Qwen/Qwen3-VL-4B-Instruct, dtype: int8}
