# The labeler's labeling config, AutolabelSettings' defaults: GDINO-B on the 10 raw names,
# untiled, fp16 -> box filter (NMS off) -> TrackTrack at its defaults over the full clips. The
# confidence floor (0.218, its max-F1 confidence on train) is TrackTrack's track_high_thresh =
# new_track_thresh and cuts the kept auto-labels, not the scored ones.
trials:
  - name: gdino-b
    detector:
      model: IDEA-Research/grounding-dino-base
      prompts:
        pedestrian: person
        people: person
        bicycle: two-three-wheeler
        car: vehicle
        van: vehicle
        truck: vehicle
        tricycle: two-three-wheeler
        awning-tricycle: two-three-wheeler
        bus: vehicle
        motor: two-three-wheeler
      dtype: float16
    box_filter: {min_side: 8, max_area: 0.05, nms_iou: null}
    confidence_floor: 0.218
    tracker: {model: tracktrack}
