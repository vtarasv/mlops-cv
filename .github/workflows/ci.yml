name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (locked, CPU-only)
        run: uv sync --locked --no-group gpu

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Pytest (CPU-only)
        run: uv run --no-sync pytest -m "not gpu and not docker"
