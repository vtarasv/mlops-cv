# Image-mode stage 4: tiling, boxes only, through stage 1's box filter. SAM 3 end to end on the
# 10 raw names untiled (the incumbent, stage 3's winner; its stored boxes rescore on CPU) against
# slices plus the full frame at zoom 1.25 (806 px slices into SAM 3's 1008 square) and 2 (504),
# merged by the edge rule, and at 1.25 with the contained merge (a CPU rescore of 1.25's passes).
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
trials:
  - name: untiled
  - name: zoom1.25
    detector: {tiling: {side: 806}}
  - name: zoom1.25-contained
    detector: {tiling: {side: 806, merge: contained}}
  - name: zoom2
    detector: {tiling: {side: 504}}
