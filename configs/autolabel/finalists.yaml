# Image-mode finalists on val-stride20: the smoke chain (GDINO-T at its 0.25 floor -> the smoke
# box filter -> SAM 2.1 S) and the tuning grid's winner (image-mode.yaml), beside the champion
# YOLO26 (boxes only, unfiltered). The winner also reads P, R and F1 at its confidence floor.
trials:
  - name: smoke
    detector:
      model: IDEA-Research/grounding-dino-tiny
      threshold: 0.25
      prompts:
        pedestrian: person
        people: person
        bicycle: two-three-wheeler
        car: vehicle
        van: vehicle
        truck: vehicle
        tricycle: two-three-wheeler
        awning-tricycle: two-three-wheeler
        bus: vehicle
        motor: two-three-wheeler
    box_filter: {min_side: 8, max_area: 0.05, min_score: 0.4, nms_iou: 0.6, nested_ios: 0.8, max_objects: 300}
    segmenter: facebook/sam2.1-hiera-small
  - name: image-mode
    detector:
      model: facebook/sam3
      prompts:
        pedestrian: person
        people: person
        bicycle: two-three-wheeler
        car: vehicle
        van: vehicle
        truck: vehicle
        tricycle: two-three-wheeler
        awning-tricycle: two-three-wheeler
        bus: vehicle
        motor: two-three-wheeler
      dtype: float16
    box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
    segmenter: facebook/sam2.1-hiera-small
    confidence_floor: 0.597
  - name: champion
    detector: {model: champion}
