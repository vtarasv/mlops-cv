# Image mode on val-stride20: the tuning grid's winner (image-mode.yaml), which also reads P, R
# and F1 at its confidence floor.
trials:
  - name: image-mode
    detector:
      model: facebook/sam3
      prompts:
        pedestrian: person
        people: person
        bicycle: two-three-wheeler
        car: vehicle
        van: vehicle
        truck: vehicle
        tricycle: two-three-wheeler
        awning-tricycle: two-three-wheeler
        bus: vehicle
        motor: two-three-wheeler
      dtype: float16
    box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
    segmenter: facebook/sam2.1-hiera-small
    confidence_floor: 0.597
