# Experiment 1, stage 4: the val check. The winner (gdino-b-raw + NMS off) and the runner-up
# (sam3-raw + NMS 0.5), untiled, fp16, on val; each floor is its max-F1 confidence on train.
defaults:
  detector:
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: null}
trials:
  - name: gdino-b-raw-nms-off
    detector: {model: IDEA-Research/grounding-dino-base}
    confidence_floor: 0.218
  - name: sam3-raw-nms0.5
    detector: {model: facebook/sam3}
    box_filter: {nms_iou: 0.5}
    confidence_floor: 0.593
