# Experiment 3: the video-tracker confirmation. EdgeTAM at K=5 (the earlier effort's best) on the
# val clips, its key frames seeded from GDINO-B's stored val-clip pass at the floor, each mask
# leaving as its tight box, beside TrackTrack at its defaults on the same pass. Detector, box
# filter and floor are Experiment 2 stage 3's.
defaults:
  detector:
    model: IDEA-Research/grounding-dino-base
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: null}
  confidence_floor: 0.218
trials:
  - name: tracktrack
    tracker: {model: tracktrack}
  - name: edgetam-k5
    tracker: {model: yonigozlan/EdgeTAM-hf, key_interval: 5}
