# Sequence-mode stage 2 on val-full: the tracker model at stage 1's K = 5. EdgeTAM is the
# incumbent (stage 1's key-interval-edgetam-k5 run, same config); SAM 2.1 S video is its sibling
# (L lost image mode). BoT-SORT and ByteTrack are contenders: one shared pass of the stored
# detector boxes, the box filter and SAM 2.1 S on every frame, the floor as their track thresholds.
defaults:
  detector:
    model: facebook/sam3
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: 0.5}
  confidence_floor: 0.597
trials:
  - name: botsort
    segmenter: facebook/sam2.1-hiera-small
    tracker: {model: botsort}
  - name: bytetrack
    segmenter: facebook/sam2.1-hiera-small
    tracker: {model: bytetrack}
  - name: edgetam-k5
    tracker: {model: yonigozlan/EdgeTAM-hf, key_interval: 5}
  - name: sam2.1-s-k5
    tracker: {model: facebook/sam2.1-hiera-small, key_interval: 5}
