[project]
name = "mlops-cv"
version = "0.1.0"
description = "MLOps level-2 pipeline for aerial object detection from video"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "pytest>=9.1.1",
]

gpu = [
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "mlflow==3.14.0",
    "pandas==2.3.3",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "ultralytics==8.4.72",
]

[tool.uv]
default-groups = ["dev", "gpu"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_cv"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle(E,W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B), simplify(SIM)
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU (skipped in CI)",
    "docker: requires Docker services (skipped in CI)",
]
