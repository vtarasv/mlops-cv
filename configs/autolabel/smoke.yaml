# The smoke chain: Grounding DINO-T on the 10 raw names -> the box filter -> SAM 2.1 S, untiled,
# plus the champion YOLO26 as the supervised reference row (boxes only, unfiltered; it runs on
# val-stride20 only). Top 300 (val's max_det) clears the image-mode sample's densest frame (157).
trials:
  - name: gdino-t-sam2.1-s
    detector:
      model: IDEA-Research/grounding-dino-tiny
      prompts:
        pedestrian: person
        people: person
        bicycle: two-three-wheeler
        car: vehicle
        van: vehicle
        truck: vehicle
        tricycle: two-three-wheeler
        awning-tricycle: two-three-wheeler
        bus: vehicle
        motor: two-three-wheeler
    box_filter: {min_side: 8, max_area: 0.05, min_score: 0.4, nms_iou: 0.6, nested_ios: 0.8, max_objects: 300}
    segmenter: facebook/sam2.1-hiera-small
  - name: champion
    detector: {model: champion}
