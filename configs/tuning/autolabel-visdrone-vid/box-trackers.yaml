# Experiment 2, stage 1: the box trackers on the train clips, at ultralytics' defaults with the
# confidence floor (Experiment 1's, 0.218) as track_high_thresh = new_track_thresh. BoT-SORT is
# the winner so far and ByteTrack the baseline. Every detector trial shares one stored pass of
# the labeler (labeler.yaml's detector and box filter); the ground-truth rows track the clips'
# ground-truth boxes instead: the association ceiling, never selecting.
defaults:
  detector:
    model: IDEA-Research/grounding-dino-base
    prompts:
      pedestrian: person
      people: person
      bicycle: two-three-wheeler
      car: vehicle
      van: vehicle
      truck: vehicle
      tricycle: two-three-wheeler
      awning-tricycle: two-three-wheeler
      bus: vehicle
      motor: two-three-wheeler
    dtype: float16
  box_filter: {min_side: 8, max_area: 0.05, nms_iou: null}
  confidence_floor: 0.218
trials:
  - name: botsort
    tracker: {model: botsort}
  - name: tracktrack
    tracker: {model: tracktrack}
  - name: bytetrack
    tracker: {model: bytetrack}
  - name: botsort-gt
    tracker: {model: botsort}
    ground_truth: true
  - name: tracktrack-gt
    tracker: {model: tracktrack}
    ground_truth: true
  - name: bytetrack-gt
    tracker: {model: bytetrack}
    ground_truth: true
