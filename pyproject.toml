[project]
name = "mlops-cv"
version = "0.1.0"
description = "MLOps level-2 pipeline for aerial object detection from video"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "pytest>=9.1.1",
    "pyright==1.1.411",
    "httpx2==2.12.0",
]

gpu = [
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "mlflow==3.14.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "ultralytics==8.4.72",
]

airflow = [
    "apache-airflow==3.2.2",
    "apache-airflow-providers-docker==4.5.7",
]

beam = [
    "apache-beam==2.75.0",
    "betterproto==2.0.0b6",
    "imagehash==4.3.2",
    "mlflow-skinny==3.14.0",
]

streaming = [
    "confluent-kafka==2.15.0",
]

monitoring = [
    "confluent-kafka==2.15.0",
    "mlflow-skinny==3.14.0",
    "prometheus-client==0.26.0",
]

serving = [
    "opencv-python-headless==4.13.0.92",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
    "prometheus-fastapi-instrumentator==8.1.0",
    "mlflow-skinny==3.14.0",
    "onnxruntime-gpu==1.27.0",
]

optimize = [
    "nvidia-ml-py==13.610.43",
    "ncnn==1.0.20260526",
    "pnnx==20260526",
    "onnx==1.22.0",
    "onnxruntime-gpu==1.27.0",
    "onnxslim==0.1.94",
    "tensorrt-cu13==10.16.1.11",
]

[tool.uv]
default-groups = [
    "dev",
    "gpu",
    "airflow",
    "beam",
    "streaming",
    "monitoring",
    "optimize",
    "serving",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_cv"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle(E,W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B), simplify(SIM)
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU (skipped in CI)",
    "docker: requires Docker services (skipped in CI)",
]
